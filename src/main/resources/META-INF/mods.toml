modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"
# issueTrackerURL = "https://github.com/NotArgxment/GTM-Extended-Features/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    # displayURL = "${mod_url}"
    # logoFile = "icon.png"
    # credits = "No Credits"
    authors = "${mod_author}"
    description = "Wireless Optical T/R Hatches & Expanded Data Hatches for Star Technology"

    [[dependencies.${mod_id}]]
        modId = "forge"
        mandatory = true
        versionRange = "[${forge_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "gtceu"
        mandatory = true
        versionRange = "[${gtceu_version},)"
        ordering = "AFTER"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "jade"
        mandatory = false
        versionRange = "[${jade_version},)"
        ordering = "NONE"
        side = "BOTH"
